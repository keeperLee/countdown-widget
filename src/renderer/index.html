<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒计时桌面小组件</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 悬浮小组件模式 -->
  <div id="widget-mode" class="widget-container">
    <div id="countdown-list" class="countdown-list">
      <!-- 倒计时卡片由 JS 动态生成 -->
    </div>
    <!-- 底部操作栏（鼠标悬停时显示） -->
    <div class="widget-toolbar">
      <button class="toolbar-btn" id="btn-edit" title="管理倒计时">⚙️</button>
      <button class="toolbar-btn" id="btn-quit" title="退出">✕</button>
    </div>
  </div>

  <!-- 编辑模式（通过 hash #edit 进入） -->
  <div id="edit-mode" class="edit-container" style="display:none;">
    <h1>🗓️ 管理倒计时</h1>

    <!-- 添加新倒计时表单 -->
    <div class="form-section">
      <h2>添加倒计时</h2>
      <div class="form-row">
        <label>名称</label>
        <input type="text" id="form-title" placeholder="如：生日、考试、旅行" maxlength="20">
      </div>
      <div class="form-row">
        <label>日期时间</label>
        <input type="datetime-local" id="form-date">
      </div>
      <div class="form-row">
        <label>图标</label>
        <select id="form-emoji">
          <option value="🎉">🎉 派对</option>
          <option value="🎂">🎂 生日</option>
          <option value="📚">📚 考试</option>
          <option value="✈️">✈️ 旅行</option>
          <option value="💼">💼 晋升</option>
          <option value="💍">💍 结婚</option>
          <option value="🏆">🏆 目标</option>
          <option value="🌟">🌟 其他</option>
        </select>
      </div>
      <div class="form-row">
        <label>颜色</label>
        <input type="color" id="form-color" value="#FF6B6B">
      </div>
      <button class="btn-primary" id="btn-add">➕ 添加</button>
    </div>

    <!-- 已有倒计时列表 -->
    <div class="form-section">
      <h2>我的倒计时</h2>
      <div id="edit-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
