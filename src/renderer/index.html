<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒计时桌面小组件</title>
  <link rel="stylesheet" href="../../node_modules/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="../../node_modules/flatpickr/dist/themes/dark.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 悬浮小组件模式 -->
  <div id="widget-mode" class="widget-container">
    <!-- 拖动把手:滚动列表不作为拖拽区,移动窗口通过这里 -->
    <div class="widget-grip" title="按住拖动小组件">⠿</div>
    <div id="countdown-list" class="countdown-list">
      <!-- 倒计时卡片由 JS 动态生成 -->
    </div>
    <!-- 底部操作栏（鼠标悬停时显示） -->
    <div class="widget-toolbar">
      <button class="toolbar-btn" id="btn-edit" title="管理倒计时">⚙️</button>
      <button class="toolbar-btn" id="btn-quit" title="退出">✕</button>
    </div>
  </div>

  <!-- 编辑模式（通过 hash #edit 进入） -->
  <div id="edit-mode" class="edit-container" style="display:none;">
    <h1>🗓️ 管理倒计时</h1>

    <!-- 添加/编辑倒计时表单 -->
    <div class="form-section">
      <h2 id="form-section-title">添加倒计时</h2>
      <div class="form-row">
        <label>名称</label>
        <input type="text" id="form-title" placeholder="如：生日、考试、旅行" maxlength="20">
      </div>
      <div class="form-row">
        <label>日期时间</label>
        <input type="text" id="form-date" placeholder="点击选择日期和时间" readonly>
      </div>
      <div class="form-row">
        <label>图标</label>
        <select id="form-emoji" hidden>
          <option value="🎉">🎉 派对</option>
          <option value="🎂">🎂 生日</option>
          <option value="📚">📚 考试</option>
          <option value="✈️">✈️ 旅行</option>
          <option value="💼">💼 晋升</option>
          <option value="💍">💍 结婚</option>
          <option value="🏆">🏆 目标</option>
          <option value="🌟">🌟 其他</option>
        </select>
        <div class="emoji-select" id="emoji-select">
          <button type="button" class="emoji-select-btn" id="emoji-select-btn">
            <span class="emoji-select-current" id="emoji-select-current">🎉</span>
            <span class="emoji-select-label" id="emoji-select-label">派对</span>
            <span class="emoji-select-arrow">▾</span>
          </button>
          <div class="emoji-select-popup" id="emoji-select-popup"></div>
        </div>
      </div>
      <div class="form-row">
        <label>颜色</label>
        <input type="color" id="form-color" value="#FF6B6B">
      </div>
      <button class="btn-primary" id="btn-add">➕ 添加</button>
      <button class="btn-cancel" id="btn-cancel-edit" style="display:none;">取消编辑</button>
    </div>

    <!-- 已有倒计时列表 -->
    <div class="form-section">
      <h2>我的倒计时</h2>
      <div id="edit-list"></div>
    </div>
  </div>

  <script src="../../node_modules/flatpickr/dist/flatpickr.min.js"></script>
  <script src="../../node_modules/flatpickr/dist/l10n/zh.js"></script>
  <script src="app.js"></script>
</body>
</html>
